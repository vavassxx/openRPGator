plugins { id 'com.android.application' version '8.5.2' }

android {
    namespace 'rpg.engine.android'
    compileSdk 35
    defaultConfig {
        applicationId 'rpg.engine.android'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation project(':engine-map') }
